name: Build LaTeX and Deploy to Pages

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Compile LaTeX
        uses: xu-cheng/latex-action@v3
        with:
          root_file: main.tex

      - name: Check compiled PDF
        run: |
          if [ ! -s main.pdf ]; then
            echo "::error file=main.tex::main.pdf was not produced or is empty"
            exit 1
          fi

      - name: Prepare Pages artifact
        run: |
          mkdir -p _site/assets
          cp main.pdf _site/resume.pdf
          cp favicon.ico favicon.svg _site/
          cp assets/apple-touch-icon.png _site/assets/
          cat > _site/index.html << 'EOF'
          <!DOCTYPE html>
          <html lang="en">
          <head>
            <meta charset="UTF-8">
            <meta name="viewport" content="width=device-width, initial-scale=1.0">
            <title>Ömer Tekin – Resume</title>
            <link rel="icon" href="favicon.ico?v=1" sizes="any">
            <link rel="icon" type="image/svg+xml" href="favicon.svg?v=1">
            <link rel="apple-touch-icon" sizes="180x180" href="assets/apple-touch-icon.png?v=1">
            <style>
              * { margin: 0; padding: 0; box-sizing: border-box; }
              body {
                min-height: 100vh;
                display: flex;
                align-items: center;
                justify-content: center;
                font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
                background: #0f0f0f;
                color: #e0e0e0;
              }
              .container {
                text-align: center;
                padding: 2rem;
              }
              p { margin-top: 1rem; font-size: 0.95rem; color: #888; }
              a {
                color: #6ea8fe;
                text-decoration: none;
                border-bottom: 1px solid transparent;
                transition: border-color 0.2s;
              }
              a:hover { border-bottom-color: #6ea8fe; }
            </style>
          </head>
          <body>
            <div class="container">
              <p>Your download should start automatically.</p>
              <p>If it doesn't, <a href="resume.pdf" download="Omer_Tekin_Resume.pdf">click here</a>.</p>
            </div>
            <script>
              window.addEventListener('DOMContentLoaded', () => {
                const link = document.createElement('a');
                link.href = 'resume.pdf';
                link.download = 'Omer_Tekin_Resume.pdf';
                document.body.appendChild(link);
                link.click();
                document.body.removeChild(link);
              });
            </script>
          </body>
          </html>
          EOF

      - name: Upload résumé PDF
        uses: actions/upload-artifact@v4
        with:
          name: resume-pdf
          path: _site/resume.pdf
          if-no-files-found: error

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    needs: build
    if: github.ref == 'refs/heads/main' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    concurrency:
      group: "pages"
      cancel-in-progress: false
    steps:
      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
