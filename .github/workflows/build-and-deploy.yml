name: Build LaTeX and Deploy to Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Compile LaTeX
        uses: xu-cheng/latex-action@v3
        with:
          root_file: main.tex

      - name: Prepare Pages artifact
        run: |
          mkdir -p _site
          cp main-2.pdf _site/resume.pdf
          cat > _site/index.html << 'EOF'
          <!DOCTYPE html>
          <html lang="en">
          <head>
            <meta charset="UTF-8">
            <meta name="viewport" content="width=device-width, initial-scale=1.0">
            <title>Ömer Tekin – Resume</title>
            <style>
              * { margin: 0; padding: 0; box-sizing: border-box; }
              body {
                min-height: 100vh;
                display: flex;
                align-items: center;
                justify-content: center;
                font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
                background: #0f0f0f;
                color: #e0e0e0;
              }
              .container {
                text-align: center;
                padding: 2rem;
              }
              p { margin-top: 1rem; font-size: 0.95rem; color: #888; }
              a {
                color: #6ea8fe;
                text-decoration: none;
                border-bottom: 1px solid transparent;
                transition: border-color 0.2s;
              }
              a:hover { border-bottom-color: #6ea8fe; }
            </style>
          </head>
          <body>
            <div class="container">
              <p>Your download should start automatically.</p>
              <p>If it doesn't, <a href="resume.pdf" download="Omer_Tekin_Resume.pdf">click here</a>.</p>
            </div>
            <script>
              window.addEventListener('DOMContentLoaded', () => {
                const link = document.createElement('a');
                link.href = 'resume.pdf';
                link.download = 'Omer_Tekin_Resume.pdf';
                document.body.appendChild(link);
                link.click();
                document.body.removeChild(link);
              });
            </script>
          </body>
          </html>
          EOF

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
